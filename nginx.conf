# Support Fins -- nginx site config (mounted at /etc/nginx/conf.d/default.conf).
#
# Serves the buildless SPA from /usr/share/nginx/html on :8080. The cache policy
# mirrors the Python dev server (no-store on the app's own JS/CSS/HTML, since
# there is no build/hash step and modules can change between image tags) while
# long-caching the vendored three.js tree, which is immutable per image tag.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects (Location: /) so the redirect target doesn't bake
    # in a host:port that may be wrong behind a reverse proxy or when the
    # container is published on a different host port.
    absolute_redirect off;

    # HTTP security headers (SEC-01)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob:; font-src 'self'; frame-ancestors 'none';" always;

    # Default: never cache. The app has no build step and no content hashes, so
    # a stale cached module would run the previous deploy's code -- the same
    # hazard the dev server exists to prevent. Overridden below for assets that
    # are immutable per image tag.
    add_header Cache-Control "no-store, must-revalidate";

    # Canonicalize the root URL -- mirrors web/_redirects (Cloudflare Pages):
    # the app is served at "/", so /index.html and /index should 301 home and
    # never be linkable or indexed as duplicates.
    #
    # $request_uri is the ORIGINAL client URI and is preserved across the
    # internal redirect the `index` directive issues for "/", so matching it
    # (not $uri) cannot loop with that internal redirect.
    if ($request_uri ~ ^/index(\.html)?(\?|$)) { return 301 /$is_args$args; }

    # Vendored three.js is immutable for the life of an image tag -- cache for a
    # year. `^~` makes this prefix match win over any regex location below.
    location ^~ /vendor/ {
        # Security headers repeated to prevent Nginx block replacement dropping parent headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob:; font-src 'self'; frame-ancestors 'none';" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icons and web manifest rarely change.
    location ~* \.(svg|png|ico|webmanifest)$ {
        # Security headers repeated to prevent Nginx block replacement dropping parent headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob:; font-src 'self'; frame-ancestors 'none';" always;
        add_header Cache-Control "public, max-age=86400";
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;
}
