# Run the Support Fins web app in a container.
#
#   docker compose up --build
#   # -> http://localhost:8731/
#
# The app is a buildless static SPA (three.js is vendored under web/vendor/),
# so the image is just nginx serving web/ on :8080. Host port 8731 matches
# `python3 dev-server.py` so the URL is identical between dev and container.

services:
  web:
    image: support-fins
    container_name: support-fins
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8731:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      # nginx:alpine ships busybox wget. Confirms nginx is actually serving /,
      # not just that the master process is alive.
      test: ["CMD-SHELL", "wget -q --spider -T 2 http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
